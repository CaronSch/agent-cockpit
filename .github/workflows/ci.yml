name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image has Chromium and its system libraries installed, so a run skips
    # the apt install that made CI take anywhere from 2 to 15 minutes. Its version must match
    # @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Install unzip (setup-bun needs it; the image does not have it)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: CLAUDE.md is up to date
        run: bun run claude-md:check

      - name: Browser tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
